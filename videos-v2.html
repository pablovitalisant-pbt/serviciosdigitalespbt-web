<script>
// 2a: el preloader solo existe si este script corre; si js/videos.js falla,
// el setTimeout lo libera igual. El try/catch cubre storage bloqueado.
(function () {
  var root = document.documentElement;
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  try { if (sessionStorage.getItem('reels_v2_preloaded')) return; } catch (e) {}
  root.classList.add('is-loading');
  setTimeout(function () { root.classList.remove('is-loading'); }, 2500);
})();
</script>
